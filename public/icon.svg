<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#6366f1" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Play Symbol / Signal Shield -->
  <g filter="url(#shadow)">
    <path d="M 210,160 L 360,256 L 210,352 Z" fill="url(#glow)"/>
    <!-- Signal arcs -->
    <path d="M 380,210 A 60,60 0 0,1 380,302" fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round"/>
    <path d="M 414,180 A 100,100 0 0,1 414,332" fill="none" stroke="#818cf8" stroke-width="14" stroke-linecap="round"/>
  </g>
</svg>
